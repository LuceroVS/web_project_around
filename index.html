<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Around USA</title>
    <meta name="author" content="Lucero Villafuerte" />
    <meta name="description" content="Around USA" />
    <meta name="keywords" content="Around, USA" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img
          class="header__title"
          src="images/title.png"
          alt="title"
          data-type="logo"
        />
      </header>
      <main>
        <section class="profile">
          <div class="profile__photo">
            <img
              class="profile__photo-picture"
              src="images/face.png"
              alt="photo"
              data-type="face"
            />
          </div>
          <div class="profile__data">
            <div class="profile__info">
              <h1 class="profile__name" id="profileInfoName">
                Lucero Villafuerte
              </h1>
              <img
                class="profile__edit-button"
                id="profile_edit_button"
                src="images/button_edit.png"
                alt="edit_photo"
                data-type="edit"
              />
            </div>
            <div class="profile__job">
              <p class="profile__profession" id="profileInfoJob">Informatica</p>
            </div>
          </div>
          <div class="profile__icon">
            <img
              class="profile__icon-add"
              id="image_edit_button"
              src="images/button_add.png"
              alt="add_info"
              data-type="add_info"
            />
          </div>
        </section>

        <!-- Popup de editar perfil -->
        <div class="popup" id="popupContainer">
          <div class="popup__content">
            <div class="popup__content-close" id="popupContainerclose">
              <p class="popup__content__closed">X</p>
            </div>
            <button type="button" class="popup__close"></button>
            <h3 class="popup__title">Editar perfil</h3>
            <form class="popup__form">
              <input
                type="text"
                class="popup__input"
                id="popupContainerName"
                name="name"
                placeholder="Nombre"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="popupContainerName-error" class="popup__error"></span>
              <input
                type="text"
                class="popup__input"
                id="popupContainerProfession"
                name="job"
                placeholder="Acerca de mí"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="popupContainerProfession-error"
                class="popup__error"
              ></span>
              <button class="popup__button" id="save" type="submit" disabled>
                Guardar
              </button>
            </form>
          </div>
        </div>

        <!-- Popup de nueva imagen -->
        <div class="popup" id="popupImage">
          <div class="popup__content">
            <div class="popup__content__closeimage" id="popupImageClose">
              <p class="popup_image">X</p>
            </div>
            <button type="button" class="popup__close"></button>
            <h3 class="popup__title">Nuevo Lugar</h3>
            <form class="popup__form">
              <input
                type="text"
                class="popup__input"
                id="popupImageName"
                name="name"
                placeholder="Nombre"
                minlength="2"
                maxlength="30"
                required
              />
              <span id="popupImageName-error" class="popup__error"></span>
              <input
                type="url"
                class="popup__input"
                id="popupImageDirection"
                name="link"
                placeholder="Imagen URL"
                required
              />
              <span id="popupImageDirection-error" class="popup__error"></span>
              <button
                class="popup__button"
                id="saveImage"
                type="submit"
                disabled
              >
                Guardar
              </button>
            </form>
          </div>
        </div>

        <!-- Popup de imagen maximizada -->
        <div class="popup popup_type_image" id="popupImageModal">
          <div class="popup__content popup__content_type_image">
            <div class="popup_image-close" id="openImageClose">
              <p class="popup_image-closed">X</p>
            </div>
            <button type="button" class="popup__close"></button>
            <img class="popup__image" src="" alt="" />
            <p class="popup__caption"></p>
          </div>
        </div>

        <section class="elements">
          <div id="elemenPlacesImages" class="elements-places"></div>
        </section>

        <template id="imagesTemplate">
          <div id="placeElemenImages" class="element-place">
            <img class="element-place__photo" src="" id="gridImages" alt="" />
            <div class="element-place-data">
              <h2 id="placeName" class="element-place-data__name"></h2>
              <img
                class="element-place-data__like"
                src="images/like.png"
                id="imageWhiteLike"
                alt="like_photo"
                data-type="like"
                data-target="white"
              />
              <img
                class="element-place-data__trash"
                src="images/trash.svg"
                id="deleteImage"
                alt="trash_photo"
                data-type="trash"
              />
            </div>
          </div>
        </template>
      </main>
      <footer class="footer">
        <p class="footer__copyrights">&copy; 2025. Around The U.S.</p>
      </footer>
    </div>
    <script type="module" src="./scripts/script.js"></script>
  </body>
</html>
